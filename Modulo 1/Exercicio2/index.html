<body>

    <h1>Paragrafos e quebra de linha</h1>

    <hr>

    <p>Você pode digitar um paragrafo o quanto quiser, basta colocar no meio das tags &lt;p&gt; e &lt;/p&gt;</p> <!--LESS THAN / GREATHER TAN-->

    <p>Se precisar quebrar no meio do paragrafo, e so escrever <br> como esse você so precisa escrever a tag br</p>

<p>Alguns simbolos ai o:</p>

    &reg;
    &copy;
    &trade;
    &euro;
    &pound;
    &yen;
    &cent;
    &Delta;
    &uarr;

<p>Agora vai ser emoji
<br>&#x1F480</p>
