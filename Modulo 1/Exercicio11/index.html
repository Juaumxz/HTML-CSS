<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML 5, podemos inserir elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>

    <ul>

        <li><abbr title="Use a tag &lt;p&gt; e &lt;/p&gt;">Parágrafos</abbr></li>

        <li><abbr title="Use a tag &lt;h1&gt; e &lt;h1&gt;">Titulos</abbr></li>

        <li><abbr title="Use a tag img">Imagens</abbr></li>

        <li><abbr title="Use a tag abbr">Abreviações</abbr></li>

        <li><abbr title="Use a tag code">Codigos-fontes</abbr></li>

        <li><abbr title="Use a tag ol">Listas númeradas</abbr></li>

        <li><abbr title="Use a tag ul">Listas com demarcadores</abbr></li>

    </ul>

</body>
</html>
