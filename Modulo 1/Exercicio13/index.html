<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML</title>
</head>
<body>
    <h1>Videos local</h1>
    <p>Este video esta hospedado no meu pc</p>
    
    <video width="500" poster="midia/minha thumb.jpg" controls>
        <source src="midia/meu video.mp4" type="video/mp4">

        <source src="midia/meu video.m4v" type="video/mp4">        

        <source src="midia/meu video.webm" type="video/webm">

        <source src="midia/meu video.ogv" type="video/ogg">

        <p>Seu navegador não tem compatibilidade com reprodução de videos</p>
    </video>

    <h1>Inserindo videos do YouTube</h1>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/7gtIh5dF9Xk?si=Wl5fq8yYIB6koA4t" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
