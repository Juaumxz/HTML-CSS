<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
        div{
            display: inline-block;
            background-color: blueviolet;
            border: 1px solid black;
            width: 100px;
            height: 100px;
            text-align: center;
        }
        div:hover{
            background-color: yellow;
        }
            

    </style>

</head>
<body>
    <div>nome 1</div>
    <div>nome 2</div>
    <div>nome 3</div>
</body>
</html>
