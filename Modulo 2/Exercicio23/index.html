<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
/*
    SELETORES PERSONALIZADOS

        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children


*/

        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .discord{
            color: blueviolet;
        }
        .youtube{
            color: red;
        }
        a:visited{
            background: black;
        }
        a{
            text-decoration: none;
        }
        a:hover{
            text-decoration: underline;
        }
        a:active{
            color: green;
        }
        .especial{
            background-color: rgb(0, 0, 0);
            border-radius: 20px;

        }
        .especial::before{
            content: ' ->';
            color: blue;
        }
        .especial::after{
            content: ' <-';
            color: blue;
        }
    </style>
</head>
<body>
    <body>
        <h1>Personalizando links</h1>
            <ul>
                <li><a href="https://Youtube.com/" target="_blank" class="youtube especial">Youtube</a></li>
                <li><a href="https://discord.com/" class="discord">Discord</a></li>
            </ul>
    </body>
</body>
</html>
