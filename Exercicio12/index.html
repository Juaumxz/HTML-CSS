<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens dinamica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="P.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="M.png" type="image/png">
        <img src="G.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audio</p>
    <audio preload="auto" autoplay> <!--so colocar loop que ele fica repetindo-->
        <source src="faaah.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador não consegue reproduzir</p>
    </audio>

    <!--MP3 WAV OGG-->

</body>
</html>
