<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELAS</title>
    <style>
        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 500px;
        }

        td, th{
            border: 1px solid black;
            padding: 5px;
      }
        thead > tr{
            background-color: rgb(212, 95, 95);
        }
</style>

</head>
<body>
    <h1>Uso de tabelas grandes</h1>

<!--
ANATOMIA DE TABELAS GRANDES
TABLE
    THEAD
        TR,TD,TH
    TBODY
        TR,TD,TH
    TFOOT
        TR,TD,TH
-->

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>  
        </thead>
           
        <tbody>
            <tr>
                <th>São Paulo</th>
                <th>45 919 049</th>
            </tr>
            <tr>
                <th>Minas Gerais</th>
                <th>21 168 791</th>
            </tr>
            <tr>
                <th>Rio de Janeiro</th>
                <th>17 264 943</th>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total de habitantes</th>
                <th>0000</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
