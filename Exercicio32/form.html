<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>

        <form autocomplete="off" action="cadastro.php" method="post">
                <fieldset>
                    <legend>Dados pessoais</legend>
        <p>
            <label for="iusuario">Usuário</label>
            <input type="text" name="usuario" id="iusuario" required minlength="5" maxlength="10" size="20" placeholder="seu usuario aqui" autocomplete="username">
        </p>
        <p>
            <label for="isenha">Senha</label>
            <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" size="22" placeholder="bota sua senha aqui" autocomplete="current-password">
        </p>
        <p>
            <label for="itelefone">Telefone</label>
            <input type="tel" name="telefone" id="itelefone" autocomplete="tel">
        </p>
        <p>
            <label for="iemail">Email</label>
            <input type="email" name="email" id="iemail">
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="3" step="0.1" required>
        </p>
        <p>
            <label for="ianiversario">Aniversario</label>
            <input type="date" name="aniversario" id="ianiversario" value="2020-07-26">
        </p>
        <p>
            <label for="ihora">Horas</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        </form>
    </fieldset>
    <fieldset style="margin-top: 30px;">
        <form action=""cadastro.php"">
            
                <legend>Jogos Favoritos</legend>
            <p>
                <input type="checkbox" name="ml" id="iml"><label for="iml">Mobile legends</label>
                </p>
                <p>
                <input type="checkbox" name="er" id="ier"><label for="ier">Elden Ring</label>
            </p>
        </form>
    </fieldset>
    <fieldset>
        <input type="radio" name="sexo" id="imas" checked> <label for="imas">Masculino</label> <br>
        <input type="radio" name="sexo" id="ifem"> <label for="ifem">Feminino</label>
    </fieldset> 
    <fieldset>
        <label for="icolor">Cor</label>
        <input type="color" name="color" id="icolor">
        <label for="irange">range</label>
        <input type="range" name="range" id="irange">
    </fieldset>
    <form action="cadastro.php">
        <fieldset>
            <label for="ifile">Arquivo
            </label>
            <input type="file" name="ifile" id="ifile">
        </fieldset>
        
    </form>
</body>
</html>
