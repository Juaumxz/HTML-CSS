<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Celular</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        html,body{
            height: 100vh;
            width: 100vh;
            background-color: black;
            background: url(imagens/fundo-madeira.jpg) no-repeat center ;
            
        }    
        main{
            height: 100vh;
            position: relative;
        }
        
        section#telefone{
            position: absolute;
            top: 50%;
            left: 50vw;
            transform: translate(-50%, -50%);

            height: 627px;
            width: 311px;
            background: url(imagens/frame-iphone.png);
            background-repeat: no-repeat;

        }
        iframe#tela{
            position: relative;
            top: 80px;
            left: 22px;
            width: 269px;
            height: 471px;
        }
        a > img{
            width: 50px;
            height: 50px;
            margin: 10px;
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.299);
        }
        a > img:hover{
            border: 1px solid white;
            transform: translate(-3px, -3px);
            transition: transform 0.3s;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.525);
        }
        #redes-sociais{
            text-align: right;
        }
        
    </style>
</head>
<body>
    <main>
        <section id="telefone">
            <iframe src="home.html" name="tela" id="tela" frameborder="0"></iframe>
        </section>

        <section id="redes-sociais">
            <a href="home.html" target="tela"><img src="imagens/logo-home.jpg" alt=""></a> <br>
            <a href="face.html" target="tela"><img src="imagens/logo-facebook.jpg" alt=""></a> <br>
        </section>
    </main>
</body>
</html>
