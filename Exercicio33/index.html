<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML + JS</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="in1">Numero 1</label>
            <input type="number" name="n1" id="in1"
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="n2">Numero 2</label>
            <input type="number" name="n2" id="in2" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            
        </p>
        <p>
            <label for="isoma">Soma</label>
            <output name="soma" id="isoma">0</output>
        </p>
        <p>
            <label for="inum">Barra</label>
            <input type="range" name="num" id="inum" oninput="ivalor.innerHTML = Number(inum.value)">
            <output name="valor" id="ivalor">5</output>
        </p>
    </form>
</body>
</html>
