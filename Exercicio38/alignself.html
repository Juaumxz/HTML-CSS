<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .conteiner{
            background-color: blue;
            border-radius: 10px;
            display: flex;
            flex-flow: row wrap;
            height: 200px;
            width: 300px;
            align-items: flex-start;
        }
        .item{
            background-color: rgb(255, 247, 247);
            border: 1px solid rgb(0, 0, 0);
            text-align: center;
            padding: 10px 15px;
            margin: 3px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" style="align-self: auto;">A</div>
        <div class="item" style="align-self: flex-start;">B</div>
        <div class="item" style="align-self: flex-end;">C</div>
        <div class="item" style="align-self: center;">D</div>
        <div class="item" style="align-self: stretch;">E</div>
    </div>
</body>
</html>
